  const fillGrid = () => {
    console.log('fill')

    grid.innerHTML = "";

    const gap = 20;
    const aspect = 8.5 / 11;
    const totalItems = emojiLinks.length;

    const maxWidth = window.innerWidth;
    const maxHeight = window.innerHeight;

    let bestCols = 1;
    let bestRows = totalItems;
    let bestCellWidth = 0;
    let bestLayoutHeight = Infinity;

    for (let cols = 1; cols <= totalItems; cols++) {
      const rows = Math.ceil(totalItems / cols);
      const totalGapW = (cols - 1) * gap;
      const totalGapH = (rows - 1) * gap;

      const cellWidth = (maxWidth - totalGapW) / cols;
      const cellHeight = cellWidth / aspect;
      const layoutHeight = cellHeight * rows + totalGapH;

      if (layoutHeight <= maxHeight) {
        // Choose the layout with the *largest* cells that still fit
        if (cellWidth > bestCellWidth) {
          bestCols = cols;
          bestRows = rows;
          bestCellWidth = cellWidth;
          bestLayoutHeight = layoutHeight;
        }
      }
    }

    const cellHeight = bestCellWidth / aspect;

    // Apply layout styles
    grid.style.gridTemplateColumns = `repeat(${bestCols}, ${bestCellWidth}px)`;
    grid.style.gridAutoRows = `${cellHeight}px`;

    const gridWidth = bestCols * bestCellWidth + (bestCols - 1) * gap;
    const gridHeight = bestRows * cellHeight + (bestRows - 1) * gap;

    wrapper.style.width = `${gridWidth}px`;
    wrapper.style.height = `${gridHeight}px`;

    for (let i = 0; i < emojiLinks.length; i++) {
      const { emoji, link } = emojiLinks[i];

      grid.appendChild(div);
    }
  }

  const random = () => {

  // Poisson Disk Sampling (Bridson's Algorithm)
  function poissonDiskSampling(width, height, radius, k = 30) {
    console.log('disc')
      const gridSize = radius / Math.sqrt(2);
      const cols = Math.ceil(width / gridSize);
      const rows = Math.ceil(height / gridSize);
      const grid = Array(cols * rows).fill(null);
      const active = [];
      const points = [];

      function toGrid(x, y) {
          return [Math.floor(x / gridSize), Math.floor(y / gridSize)];
      }

      function inBounds(x, y) {
          return x >= 0 && y >= 0 && x < width && y < height;
      }

      function isFarEnough(x, y) {
          const [gx, gy] = toGrid(x, y);
          for (let i = -2; i <= 2; i++) {
              for (let j = -2; j <= 2; j++) {
                  const nx = gx + i, ny = gy + j;
                  if (nx >= 0 && ny >= 0 && nx < cols && ny < rows) {
                      const idx = nx + ny * cols;
                      const p = grid[idx];
                      if (p) {
                          const dx = p.x - x, dy = p.y - y;
                          if (dx * dx + dy * dy < radius * radius) return false;
                      }
                  }
              }
          }
          return true;
      }

      function addPoint(x, y) {
          const [gx, gy] = toGrid(x, y);
          const idx = gx + gy * cols;
          grid[idx] = { x, y };
          points.push({ x, y });
          active.push({ x, y });
      }

      addPoint(Math.random() * width, Math.random() * height);

      while (active.length > 0) {
          const randIndex = Math.floor(Math.random() * active.length);
          const point = active[randIndex];
          let placed = false;

          for (let i = 0; i < k; i++) {
              const angle = Math.random() * Math.PI * 2;
              const r = radius * (1 + Math.random() * 0.5);
              const newX = point.x + Math.cos(angle) * r;
              const newY = point.y + Math.sin(angle) * r;

              if (inBounds(newX, newY) && isFarEnough(newX, newY)) {
                  addPoint(newX, newY);
                  placed = true;
                  break;
              }
          }

          if (!placed) active.splice(randIndex, 1);
      }

      return points;
  }


  const sizeCanvas = () => {

  const positionEmoji = () => {
    const dpr = window.devicePixelRatio || 1;
    const emojiSize = Math.min(canvas.width, canvas.height) * 0.015; 
    const radius = emojiSize * 2.5; // Ensure slight spacing

    // Get Poisson Disk points
    const points = poissonDiskSampling(canvas.width / dpr, canvas.height / dpr, radius);

    // Draw emojis
    
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";

    sizeCanvas()

  const onMouseMove = (event) => {
    const canvas = document.getElementById("emojiCanvas");
    const ctx = canvas.getContext("2d");


    const { clientX: mouseX, clientY: mouseY } = event;
    if (!animationFrameId) {
        animationFrameId = requestAnimationFrame(() => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          renderedEmojis.forEach((emoji) => {
            const centerX = emoji.x + 5;
            const centerY = emoji.y + 5;
            const dx = centerX - mouseX;
            const dy = centerY - mouseY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            const maxScale = 3.4;
            const minScale = 1;
            const falloff = 110;
            const scale = minScale + (maxScale - minScale) * Math.exp(-distance / falloff);

            emoji.scale = scale;
            const emojiSize = Math.min(canvas.width, canvas.height) * 0.015;

            ctx.font = `200 ${emojiSize * emoji.scale}px"Noto Emoji"`;
            ctx.fillText(emoji.emoji, emoji.x, emoji.y);
          });

          animationFrameId = null; // Reset for the next frame
      });
    }
